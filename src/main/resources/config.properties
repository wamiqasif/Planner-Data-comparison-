# =============================================================================
# Portfolio Planner API Test Framework — Base Configuration
# =============================================================================
# NON-SENSITIVE values only.
# Sensitive values (tokens, cookies, auth headers) must be supplied as
# environment variables. See README or HeaderManager for expected env var names.
#
# Any property here can be overridden by setting an env var whose name is
# the property key uppercased with dots replaced by underscores.
# Example: api1.base.url  →  API1_BASE_URL
#
# For environment-specific overrides, create config-<env>.properties next to
# this file (e.g. config-uat.properties) and set ENV=uat before running.
# =============================================================================

# Active environment name (used to load optional config-<env>.properties overlay)
environment=qa

# -----------------------------------------------------------------------------
# API 1  –  Portfolio Planner (QA)
# Base URL  :  https://qaappapi.valueresearch.in
# Endpoint  :  POST /api/v1/planner/generate
# Content-Type: application/json
# Auth      :  set env var  API1_AUTH_TOKEN  and/or  API1_COOKIE
# -----------------------------------------------------------------------------
api1.base.url=https://qaadvappapi.valueresearch.in
api1.endpoint=/api/v1/planner/funds-buy/generate
api1.content.type=application/json

# Timeouts in seconds
api1.timeout.connect=35
api1.timeout.read=50

# -----------------------------------------------------------------------------
# API 2  –  Investment Plan (Advisor / Prod-mirror)
# Base URL  :  https://advappapi.valueresearchonline.com
# Endpoint  :  POST /api/v0/investment-plan/
# Content-Type: multipart/form-data  (set by REST Assured; do NOT set manually)
# Auth      :  set env var  API2_AUTH_TOKEN  and/or  API2_COOKIE
# -----------------------------------------------------------------------------
api2.base.url=https://advappapi.valueresearchonline.com
api2.endpoint=/api/v0/investment-plan/
api2.content.type=multipart/form-data

# Timeouts in seconds
api2.timeout.connect=38
api2.timeout.read=35

# -----------------------------------------------------------------------------
# API 2 – non-sensitive application headers
# Override at runtime with env vars (dots → underscores, uppercased):
#   api2.header.app.platform → API2_HEADER_APP_PLATFORM
#   api2.header.app.type     → API2_HEADER_APP_TYPE
#   api2.header.app.version  → API2_HEADER_APP_VERSION
#   api2.header.site.code    → API2_HEADER_SITE_CODE
# Sensitive headers (auth-token, json-api-key, Authorization, Cookie)
# must be supplied exclusively via environment variables — see HeaderManager.
# -----------------------------------------------------------------------------
api2.header.app.platform=android
api2.header.app.type=ADV_APP
api2.header.app.version=1.0.32
api2.header.site.code=VROADV

# -----------------------------------------------------------------------------
# Authentication — API 1
# Credentials for https://qaappapi.valueresearch.in
# API-1 authenticates via session cookie only; no Authorization header is sent.
#
# Priority (highest first):
#   1. Environment variable  API1_COOKIE  →  api1.cookie
#   2. config-local.properties           (developer-local override, git-ignored)
#   3. This file                         (keep values empty here)
# -----------------------------------------------------------------------------
api1.cookie=
# api1.auth.token is reserved for future use; not sent to API-1 currently
api1.auth.token=

# -----------------------------------------------------------------------------
# Authentication — API 2
# Credentials for https://advappapi.valueresearchonline.com
#
# Priority (highest first):
#   1. Environment variables  API2_AUTHORIZATION / API2_AUTH_TOKEN /
#      API2_JSON_API_KEY / API2_COOKIE
#   2. config-local.properties  (developer-local override, git-ignored)
#   3. This file                (keep values empty here)
#
# Header mapping:
#   api2.authorization  ->  Authorization  (full value incl. scheme, e.g. "Basic …")
#   api2.auth.token     ->  auth-token
#   api2.json.api.key   ->  json-api-key
#   api2.cookie         ->  Cookie
# -----------------------------------------------------------------------------
api2.authorization=Basic dmFsdWVyZXNlYXJjaGRldjpGQHdrZSQ=
api2.auth.token=149e0360982570d06c32919d27f4156e
api2.json.api.key=b15a035d2cf558e141baf0da38691eeee0841200
api2.cookie=

# -----------------------------------------------------------------------------
# Comparison settings
# -----------------------------------------------------------------------------
# Monetary amounts are considered equal if the absolute difference is within
# this tolerance (in the same unit as the API response — typically rupees).
comparison.amount.tolerance=100

# Breakdown percentages (0-100 scale) are considered equal if the absolute
# difference is within this tolerance. Kept separate from
# comparison.amount.tolerance so a large rupee tolerance can't silently
# disable percentage-mismatch detection.
comparison.percentage.tolerance=1

# Maximum number of differences to record per comparison run
comparison.max.diff.count=1000

# -----------------------------------------------------------------------------
# Alternate-fund business validation — fund-opinion-data / fund-details lookup
# -----------------------------------------------------------------------------
# When API-1 offers a fund with a different plan_id than API-2's fund for the
# same slot, API-2 is the original/reference fund and the API-1 fund is an
# alternate candidate. Orphaned funds (unmatched by plan_id) on both sides are
# paired by category_name (Fund Details API below), then the API-1 side is
# validated against 5 business rules using Fund Opinion data — never reported
# as a plain MISSING_FIELD/EXTRA_FIELD mismatch just because plan_id differs.
# See com.vr.portfolioplanner.altfund.AlternateFundValidator.
fund.opinion.base.url=https://qaappapi.valueresearch.in
fund.opinion.endpoint=/api/v1/funds/fund-opinion-data/get-list

# Fund Details API — category_name lookup, used both for pairing orphaned
# funds across API-1/API-2 and for Rule 2 (prohibited classification).
fund.details.base.url=https://qaappapi.valueresearch.in
fund.details.endpoint=/api/v1/funds/

# -----------------------------------------------------------------------------
# Retry / resilience
# -----------------------------------------------------------------------------
http.retry.count=2
http.retry.delay.ms=1200
